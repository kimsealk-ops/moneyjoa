<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자산운영하기 온라인</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0D0B;--panel:#1B1712;--panel2:#221D17;--border:#382E22;--gold:#D4A72C;--red:#E5484D;--blue:#5B8CFF;--text:#F5EFE6;--muted:#9C9284;--hd:'Do Hyeon',sans-serif;--bd:'IBM Plex Sans KR',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1a1510,#0F0D0B 55%);color:var(--text);font-family:var(--bd);min-height:100vh}
.hidden{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 50px}
h1{font-family:var(--hd);color:var(--gold);font-size:34px;text-align:center;margin:30px 0 4px}
.sub{color:var(--muted);text-align:center;font-size:13px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
input{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:11px;font-size:15px;width:100%;font-family:var(--bd)}
.row{display:flex;gap:8px;margin-top:10px}
.btn{background:linear-gradient(180deg,#E8BE47,#C79420);color:#221A08;border:0;border-radius:10px;padding:12px 18px;font-family:var(--hd);font-size:16px;cursor:pointer;width:100%}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
.code{font-family:var(--hd);font-size:46px;color:var(--gold);text-align:center;letter-spacing:6px}
.pl{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #241E17;font-size:14px}
.me{color:var(--gold);font-weight:600}
.top{position:sticky;top:0;z-index:9;background:#14110D;border-bottom:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;justify-content:space-between;align-items:center}
.pill{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:6px 12px;text-align:right;line-height:1.15}
.pill small{display:block;font-size:10px;color:var(--muted)}
.pill b{font-family:var(--hd);font-size:16px}
.tabs{display:flex;gap:6px;margin:12px 0}
.tab{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:10px;cursor:pointer;font-family:var(--bd);font-weight:600}
.tab.on{color:var(--gold);border-color:#8C7328}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--muted);padding:6px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#151210}
td{padding:6px;border-bottom:1px solid #241E17}
.scroll{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:10px}
.q{width:58px;padding:4px;font-size:12px}
.mini{background:#2A2219;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 7px;font-size:11px;cursor:pointer;margin-right:2px}
.mini:disabled{opacity:.3}
.up{color:var(--red)}.dn{color:var(--blue)}.mut{color:var(--muted)}
tr.dead td{color:#5a5248}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2A2219;border:1px solid var(--gold);padding:10px 16px;border-radius:10px;font-size:14px;z-index:99}
.rank{font-family:var(--hd);width:34px;display:inline-block}
</style>
</head>
<body>
<div class="wrap">

<div id="entry">
  <h1>💰 자산운영하기</h1>
  <div class="sub">10분 안에 자산을 불려라 · 최대 10명 온라인 대결</div>
  <div class="card">
    <div class="lbl">닉네임 (최대 10자)</div>
    <input id="nm" maxlength="10" placeholder="닉네임 입력">
    <div class="row"><button class="btn" onclick="createRoom()">방 만들기</button></div>
  </div>
  <div class="card">
    <div class="lbl">친구가 알려준 방 코드</div>
    <input id="cd" maxlength="6" placeholder="예: K7M2QX" style="text-transform:uppercase">
    <div class="row"><button class="btn ghost" onclick="joinRoom()">방 입장</button></div>
  </div>
</div>

<div id="lobby" class="hidden">
  <h1>대기실</h1>
  <div class="card">
    <div class="lbl" style="text-align:center">방 코드</div>
    <div class="code" id="roomCode"></div>
    <div class="row"><button class="btn ghost" onclick="copyLink()">초대 링크 복사</button></div>
  </div>
  <div class="card">
    <div class="lbl" id="plCount"></div>
    <div id="plList"></div>
  </div>
  <button class="btn" id="startBtn" onclick="act({type:'start'})">게임 시작</button>
  <div class="sub" id="waitMsg" style="margin-top:10px"></div>
</div>

<div id="game" class="hidden">
  <div class="top" style="margin:0 -14px">
    <div class="pill"><small>보유 현금</small><b id="gMoney"></b></div>
    <div class="pill"><small>총 자산</small><b id="gTotal"></b></div>
    <div class="pill"><small>남은 시간</small><b id="gTime"></b></div>
  </div>
  <div class="tabs">
    <button class="tab on" data-t="stock">📈 주식</button>
    <button class="tab" data-t="coin">🪙 코인</button>
    <button class="tab" data-t="rank">🏆 순위</button>
  </div>
  <div id="p-stock"><div class="scroll"><table><thead><tr><th>종목</th><th>현재가</th><th>등락</th><th>보유</th><th>수량</th><th>거래</th></tr></thead><tbody id="stockBody"></tbody></table></div></div>
  <div id="p-coin" class="hidden"><div class="scroll"><table><thead><tr><th>코인</th><th>현재가</th><th>등락</th><th>보유</th><th>수량</th><th>거래</th></tr></thead><tbody id="coinBody"></tbody></table></div></div>
  <div id="p-rank" class="hidden">
    <div class="card"><div class="lbl">🏆 실시간 순위 (현금 + 보유 평가액)</div><div id="board"></div></div>
    <div class="card"><div class="lbl">💼 내 보유 종목</div><div id="mine"></div></div>
  </div>
</div>

<div id="end" class="hidden">
  <h1>🏁 게임 종료</h1>
  <div class="card"><div class="lbl">최종 순위</div><div id="final"></div></div>
  <button class="btn" onclick="newGame()">새 게임</button>
</div>

</div>
<div class="toast hidden" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('ko-KR');
let S = null, es = null, built = false, sess = null;
try { sess = JSON.parse(localStorage.getItem('sess')); } catch(e) {}

function show(id){ ['entry','lobby','game','end'].forEach(x=> $(x).classList.toggle('hidden', x!==id)); }
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.remove('hidden'); clearTimeout(tt); tt=setTimeout(()=>t.classList.add('hidden'),2500); }
async function api(path, body){
  const r = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error||'오류가 발생했습니다');
  return j;
}
function save(){ try{ localStorage.setItem('sess', JSON.stringify(sess)); }catch(e){} }
function act(body){ return api('/api/action', Object.assign({code:sess.code, pid:sess.pid}, body)).catch(e=>toast(e.message)); }

async function createRoom(){
  try{ sess = await api('/api/create',{name:$('nm').value}); save(); connect(); }catch(e){ toast(e.message); }
}
async function joinRoom(){
  try{ sess = await api('/api/join',{name:$('nm').value, code:$('cd').value}); save(); connect(); }catch(e){ toast(e.message); }
}
function connect(){
  if(es) es.close();
  es = new EventSource('/api/events?code='+sess.code+'&pid='+sess.pid);
  es.onmessage = e => { S = JSON.parse(e.data); render(); };
  es.onerror = () => {
    if(es.readyState===EventSource.CLOSED){
      try{ localStorage.removeItem('sess'); }catch(e){}
      sess = null; show('entry'); toast('방에 다시 접속할 수 없습니다');
    }
  };
}
function copyLink(){
  const link = location.origin + '/?room=' + S.code;
  (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(()=>toast('초대 링크를 복사했어요'), ()=>prompt('링크를 복사하세요', link));
}
function newGame(){ try{ localStorage.removeItem('sess'); }catch(e){} location.href = '/'; }

function render(){
  if(S.phase==='lobby'){ show('lobby'); renderLobby(); }
  else if(S.phase==='playing'){ show('game'); if(!built) build(); update(); }
  else { show('end'); renderEnd(); }
}
function renderLobby(){
  $('roomCode').textContent = S.code;
  $('plCount').textContent = '참가자 ' + S.board.length + ' / 10';
  $('plList').innerHTML = S.board.map(p =>
    '<div class="pl"><span class="'+(p.id===S.me.id?'me':'')+'">'+esc(p.name)+(p.id===S.hostId?' 👑':'')+'</span><span class="mut">'+(p.online?'접속 중':'끊김')+'</span></div>').join('');
  const host = S.hostId===S.me.id;
  $('startBtn').classList.toggle('hidden', !host);
  $('waitMsg').textContent = host ? '준비되면 시작 버튼을 눌러주세요' : '방장이 시작하길 기다리는 중...';
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function build(){
  built = true;
  ['stock','coin'].forEach(kind=>{
    const list = kind==='stock' ? S.stocks : S.coins;
    $(kind+'Body').innerHTML = list.map((it,i)=>
      '<tr data-i="'+i+'"><td>'+it.name+'</td><td class="pr"></td><td class="ch"></td><td class="hd"></td>'+
      '<td><input class="q" type="number" min="1" value="1"></td>'+
      '<td><button class="mini" data-a="buy">매수</button><button class="mini" data-a="sell">매도</button>'+
      '<button class="mini" data-a="max">최대</button><button class="mini" data-a="all">전량</button></td></tr>').join('');
    $(kind+'Body').addEventListener('click', e=> onTrade(kind, e));
  });
  document.querySelectorAll('.tab').forEach(b=> b.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=> x.classList.toggle('on', x===b));
    ['stock','coin','rank'].forEach(t=> $('p-'+t).classList.toggle('hidden', t!==b.dataset.t));
  });
}
function onTrade(kind, e){
  const b = e.target.closest('button'); if(!b) return;
  const tr = b.closest('tr'), i = +tr.dataset.i, q = tr.querySelector('.q');
  const it = (kind==='stock' ? S.stocks : S.coins)[i];
  const h = S.me.holdings[(kind==='stock'?'s':'c')+i];
  if(b.dataset.a==='max'){ q.value = Math.max(1, Math.floor(S.me.money/it.price)); return; }
  if(b.dataset.a==='all'){ q.value = h ? h.qty : 1; return; }
  act({type:b.dataset.a, kind, idx:i, qty:parseInt(q.value)||1});
}
function updTable(kind, list){
  const tb = $(kind+'Body');
  list.forEach((it,i)=>{
    const tr = tb.children[i], h = S.me.holdings[(kind==='stock'?'s':'c')+i];
    tr.querySelector('.pr').textContent = it.delisted ? '-' : fmt(it.price)+'원';
    const ch = tr.querySelector('.ch');
    ch.textContent = it.delisted ? '상장폐지' : (it.change>0?'+':'')+it.change+'%';
    ch.className = 'ch '+(it.delisted?'mut':(it.change>0?'up':(it.change<0?'dn':'')));
    tr.querySelector('.hd').textContent = h ? h.qty : 0;
    tr.classList.toggle('dead', it.delisted);
    tr.querySelectorAll('button').forEach(x=> x.disabled = it.delisted);
  });
}
function clock(t){ return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
function boardHtml(){
  const medal = ['🥇','🥈','🥉'];
  return S.board.map((p,i)=>
    '<div class="pl"><span class="'+(p.id===S.me.id?'me':'')+'"><span class="rank">'+(medal[i]||(i+1))+'</span>'+esc(p.name)+'</span><b>'+fmt(p.total)+'원</b></div>').join('');
}
function update(){
  $('gMoney').textContent = fmt(S.me.money)+'원';
  $('gTotal').textContent = fmt(S.me.total)+'원';
  $('gTime').textContent = clock(S.timeLeft);
  updTable('stock', S.stocks); updTable('coin', S.coins);
  $('board').innerHTML = boardHtml();
  const keys = Object.keys(S.me.holdings);
  $('mine').innerHTML = keys.length ? '<table><thead><tr><th>종목</th><th>보유</th><th>평단가</th><th>현재가</th><th>손익</th></tr></thead><tbody>'+
    keys.map(k=>{
      const it = (k[0]==='s'?S.stocks:S.coins)[+k.slice(1)], h = S.me.holdings[k];
      const pl = (it.price-h.avg)*h.qty;
      return '<tr><td>'+it.name+'</td><td>'+h.qty+'</td><td>'+fmt(h.avg)+'원</td><td>'+fmt(it.price)+'원</td><td class="'+(pl>0?'up':(pl<0?'dn':''))+'">'+(pl>=0?'+':'')+fmt(pl)+'원</td></tr>';
    }).join('')+'</tbody></table>' : '<div class="mut" style="font-size:13px">보유 중인 종목이 없습니다.</div>';
}
function renderEnd(){ $('final').innerHTML = boardHtml(); }

const qs = new URLSearchParams(location.search).get('room');
if(qs) $('cd').value = qs.toUpperCase();
if(sess) connect();
</script>
</body>
</html>
